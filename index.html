<script>
  const inputs = document.querySelectorAll('.code-input');
  let isBackspacing = false;

  const CORRECT_HASH = "3ef122b2fbeefefd4bc645e1959e3070ec5b725c3e992d05101e9de9077062ec";

  // Асинхронная функция для генерации SHA-256 хэша из строки
  async function sha256(string) {
    const utf8 = new TextEncoder().encode(string);
    const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(bytes => bytes.toString(16).padStart(2, '0')).join('');
  }

  // Функция проверки пароля
  async function checkPassword() {
    let password = Array.from(inputs).map(inp => inp.value).join('');
    
    // Генерируем хэш от введенного пользователем пароля
    const inputHash = await sha256(password);

    // Сравниваем зашифрованные хэши
    if (inputHash === CORRECT_HASH) {
      window.location.href = 'index_3ef122b2fbeefefd4bc645e1959e3070ec5b725c3e992d05101e9de9077062ec.html'; 
    } else {
      alert('Incorrect password, try again.');
      inputs.forEach(inp => inp.value = ''); 
      // Возвращаем фокус на первое поле
      if (inputs.length > 0) inputs[0].focus(); 
    }
  }

  inputs.forEach((input, index) => {
    input.addEventListener('focus', (e) => {
      if (isBackspacing) return;
      const firstEmptyInput = Array.from(inputs).find(inp => !inp.value);
      if (firstEmptyInput && firstEmptyInput !== e.target) {
        firstEmptyInput.focus();
      } else if (!firstEmptyInput && index !== inputs.length - 1) {
        inputs[inputs.length - 1].focus();
      }
    });

    input.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      if (e.target.value && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace') {
        isBackspacing = true;
        if (!input.value && index > 0) {
          inputs[index - 1].focus();
        }
        setTimeout(() => { isBackspacing = false; }, 50);
      }
      
      if (e.key === 'Enter') {
        checkPassword();
      }
    });
  });

  document.querySelector('.button-submit').addEventListener('click', checkPassword);
</script>
