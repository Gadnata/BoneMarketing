<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BoneInvest">
<meta name="application-name" content="BoneInvest">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BoneInvest</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
html{background:#000;color-scheme:dark;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#000;min-height:100vh;display:flex;justify-content:center;align-items:center;color:#fff;padding:89px 20px 70px;overflow:hidden}
.logo{position:absolute;top:14px;left:50%;transform:translateX(-50%);height:clamp(64px,10.5vh,104px);width:auto;max-width:40vw;object-fit:contain;z-index:5;pointer-events:none;user-select:none;-webkit-user-select:none}
.list{position:absolute;top:88px;left:16px;padding:12px 24px;max-height:calc(100vh - 88px - 70px);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;display:flex;flex-direction:column;gap:14px;z-index:5}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:3px}
.list::-webkit-scrollbar-track{background:transparent}
.item{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;opacity:.85;user-select:none;-webkit-user-select:none;transition:transform .2s cubic-bezier(.25,1,.5,1),opacity .2s}
.item:hover,.item.hovered{opacity:1;transform:translateX(5px)}
.item.off{opacity:.3;transform:none}
.item.off .name,.item.off .ticker{text-decoration:line-through}
.dot{width:16px;height:16px;border-radius:50%;flex:none;cursor:pointer;transition:.2s}
.name,.ticker,.pct{display:inline-block;min-width:10px;outline:none;cursor:text;user-select:text;-webkit-user-select:text;caret-color:#fff}
.ticker{color:rgba(255,255,255,.4);font-size:12px;margin-left:6px}
.pct{font-weight:600;margin-left:8px;background:rgba(255,255,255,.08);padding:2px 8px;border-radius:20px;font-size:12px;min-width:34px;text-align:center}
.item.off .pct{cursor:pointer}
.item.off .pct:hover{background:rgba(255,255,255,.2)}
.del{border:0;background:none;color:rgba(255,255,255,.5);font-size:13px;cursor:pointer;opacity:0;transition:.2s;padding:4px}
.item:hover .del{opacity:1}
.del:hover{color:#ff453a}
@media (hover:none){.del{opacity:.55}}
.add{width:28px;height:28px;border-radius:50%;border:0;outline:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);font-size:18px;line-height:1;cursor:pointer;transition:.2s}
.add:hover{background:rgba(255,255,255,.18);color:#fff;transform:scale(1.1)}
.share{position:absolute;top:40px;right:40px;z-index:5;display:flex;align-items:center;padding:12px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;cursor:pointer;transition:.2s}
.share:hover{background:rgba(255,255,255,.18)}
.wrap{position:relative;flex:none;width:min(750px,calc(100vw - 40px),calc(100vh - 159px));aspect-ratio:1;z-index:2;display:flex;justify-content:center;align-items:center}
.lens{width:82.67%;height:82.67%;border-radius:50%;backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);position:absolute;z-index:1;pointer-events:none}
.scale{position:absolute;width:84.8%;height:84.8%;z-index:2;pointer-events:none;overflow:visible}
canvas{position:absolute;z-index:4;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.pop{position:fixed;z-index:10;display:none;width:232px;padding:14px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:#141414;flex-direction:column;gap:12px}
.pop.open{display:flex}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:22px;height:22px;border-radius:50%;border:0;cursor:pointer;transition:.15s}
.sw:hover{transform:scale(1.15)}
.sw.active{box-shadow:0 0 0 2px #141414,0 0 0 3.5px #fff}
.rainbow{position:relative;width:22px;height:22px;border-radius:50%;overflow:hidden;flex:none;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);transition:.15s}
.rainbow:hover{transform:scale(1.15)}
.rainbow input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);opacity:0;cursor:pointer}
.row{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.55)}
#fAlpha{-webkit-appearance:none;appearance:none;width:100%;height:20px;border-radius:10px;outline:none;cursor:pointer;touch-action:none;background-color:#141414;background-image:none;color-scheme:dark}
#fAlpha::-webkit-slider-runnable-track{height:20px;border-radius:10px;background:linear-gradient(to right,transparent,var(--c,#fff)),repeating-conic-gradient(rgba(255,255,255,.22) 0 25%,transparent 0 50%) 0 0/10px 10px,#141414}
#fAlpha::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-1px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.6)}
#fAlpha::-moz-range-track{height:20px;border-radius:10px;background:linear-gradient(to right,transparent,var(--c,#fff)),repeating-conic-gradient(rgba(255,255,255,.22) 0 25%,transparent 0 50%) 0 0/10px 10px,#141414}
#fAlpha::-moz-range-thumb{width:22px;height:22px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.6)}
.toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,20px);padding:12px 22px;border-radius:20px;background:rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- AI ---------- */
.ai-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:12;min-width:60px;padding:8px 20px;border-radius:20px;border:1px solid rgba(255,255,255,.22);background:#141414;color:#fff;font-size:13px;font-weight:700;letter-spacing:.4px;cursor:pointer;transition:background .2s,transform .2s}
.ai-btn:hover{background:#2e2e2e}
.ai-btn:active{transform:translateX(-50%) scale(.96)}
.ai-btn.busy{opacity:.6;pointer-events:none}
.ai-panel{position:fixed;left:50%;bottom:64px;width:min(680px,calc(100vw - 24px));max-height:min(56vh,440px);overflow-x:hidden;overflow-y:auto;z-index:11;padding:12px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:#141414;opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity .25s,transform .25s;-webkit-overflow-scrolling:touch}
.ai-panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.ai-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;font-weight:600}
.ai-close{border:0;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:10px}
.ai-close:hover{background:rgba(255,255,255,.18);color:#fff}
.ai-msg{font-size:12px;color:rgba(255,255,255,.7);line-height:1.5;padding:8px 2px}
.ai-msg.err{color:#ff8a80}
.ai-scroll{overflow:visible}
.ai-table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:11px;white-space:nowrap}
.ai-table th:first-child{width:96px}
.ai-table sup{font-size:7px;margin-left:1px}
.ai-table th,.ai-table td{padding:6px 2px;text-align:right;border-bottom:1px solid rgba(255,255,255,.07)}
.ai-table th{font-weight:500;color:rgba(255,255,255,.5);font-size:10px}
.ai-table th:first-child,.ai-table td:first-child{text-align:left;overflow:hidden;text-overflow:ellipsis}
.ai-table td.up{color:#30d158}
.ai-table td.down{color:#ff453a}
.ai-table td.na{color:rgba(255,255,255,.35);font-size:10px}
.ai-table tr.total td{font-weight:700;border-top:1px solid rgba(255,255,255,.2);border-bottom:0}
.ai-fund{display:flex;align-items:center;gap:6px;min-width:0}
.ai-fund>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ai-sub{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:9px;color:rgba(255,255,255,.4)}
.ai-fund i{width:8px;height:8px;border-radius:50%;flex:none}
.ai-src{margin-top:10px;font-size:10px;color:rgba(255,255,255,.45);line-height:1.4}
.ai-review{margin-top:12px;font-size:12px;line-height:1.5;color:rgba(255,255,255,.8)}
.ai-review p{color:rgba(255,255,255,.65);margin-bottom:8px}
.ai-review h4{font-size:12px;font-weight:600;margin:10px 0 4px}
.ai-review ul{list-style:none}
.ai-review li{position:relative;padding-left:16px;margin-bottom:3px}
.ai-review li::before{position:absolute;left:0;font-weight:700}
.ai-review .pros li::before{content:'+';color:#30d158}
.ai-review .cons li::before{content:'\2212';color:#ff453a}
.ai-review .ideas li::before{content:'\2192';color:#64d2ff}

@media (max-width:820px){
    body{flex-direction:column;justify-content:flex-start;align-items:stretch;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom));gap:22px}
    .logo{position:static;transform:none;display:block;height:52px;max-width:calc(100% - 130px);margin:0 auto;flex:none}
    .list{position:static;gap:12px;padding:0;max-height:none;overflow:visible}
    .share{position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px}
    .wrap{width:min(560px,100%);margin:0 auto}
    .item{font-size:15px}
    .ai-btn{bottom:calc(14px + env(safe-area-inset-bottom))}
    .ai-panel{bottom:calc(56px + env(safe-area-inset-bottom))}
    .toast{bottom:80px}
    .ai-panel{width:calc(100vw - 16px);padding:10px 8px}
    .ai-table{font-size:9px}
    .ai-table th{font-size:8px}
    .ai-table th:first-child{width:58px}
    .ai-table th,.ai-table td{padding:5px 1px}
    .ai-fund{gap:3px}
    .ai-fund i{width:6px;height:6px}
    .ai-sub{font-size:7px}
}
</style>
</head>

<script>
const CONFIG = {
    PIZZA_GLOW_ON: 1,
    PIZZA_GLOW_OFF: 0.1,
    DOT_GLOW_ON: 0.4,
    DOT_GLOW_OFF: 0.6,
    NEON_BORDER_BRIGHTNESS: 0.5,
    BACK_LENS_GLOW: 0.2,
    CENTER: 700,
    BASE_RADIUS: 560,
    HOVER_SCALE: 1.05,
    RECENT_LIMIT: 7,
    RECENT_KEY: 'portfolio-recent-colors',

    // Насколько цифры линейки растут на телефоне (0 = не растут, 1 = как текст в кусках, больше 1 = ещё крупнее)
    SCALE_TEXT_BOOST: 1.7,

    // ИИ работает через ваш Cloudflare Worker (см. worker.js). Без адреса показывается встроенная офлайн-оценка.
    AI_PROXY_URL: 'https://investai.invest-ai.workers.dev',
    AI_TIMEOUT: 45000,
    AI_YEARS: [1, 3, 5, 10, 20, 30, 40, 50, 80, 100]
};

const DEFAULTS = [
    { n: 'Инфляционные облигации', t: 'bTIPS', p: 30, c: '#ffffff', a: 0.55 },
    { n: 'Недвижимость', t: 'RealT', p: 20, c: '#006eff', a: 0.8 },
    { n: 'Продукты и товары', t: 'bXLP', p: 15, c: '#b400ff', a: 0.8 },
    { n: 'Медицина и аптеки', t: 'bXLV', p: 15, c: '#ff005a', a: 0.8 },
    { n: 'Энергетика и ЖКХ', t: 'bXLU', p: 10, c: '#00f0f0', a: 0.8 },
    { n: 'Ликвидный кэш', t: 'Ondo USDY/USDT', p: 10, c: '#f0f000', a: 0.75 }
];

const PALETTE = ['#ff9500', '#34c759', '#5e5ce6', '#ff2d55', '#64d2ff', '#ffd60a', '#bf5af2', '#30d158'];
const HEX = /^#[0-9a-f]{6}$/i;

const $ = id => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const listEl = $('list');
const pop = $('pop');

let uid = 0;
let items = [];
let slices = [];
let hoveredId = null;
let editingId = null;
let frame = 0;

const makeItem = d => ({ id: uid++, enabled: true, scale: 1, ...d });

const rgba = (hex, a) => {
    const v = parseInt(hex.slice(1), 16);
    return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${a})`;
};

const escapeHtml = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

const selectAll = el => {
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
};

const caretToEnd = el => {
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
};

const loadRecent = () => {
    try {
        const saved = JSON.parse(localStorage.getItem(CONFIG.RECENT_KEY));
        const valid = Array.isArray(saved) ? saved.filter(c => HEX.test(c)) : [];
        if (valid.length) return valid.slice(0, CONFIG.RECENT_LIMIT);
    } catch (e) {}
    return DEFAULTS.map(d => d.c).concat(PALETTE).slice(0, CONFIG.RECENT_LIMIT);
};

let recent = loadRecent();

const pushRecent = color => {
    const c = color.toLowerCase();
    recent = [c, ...recent.filter(r => r !== c)].slice(0, CONFIG.RECENT_LIMIT);
    try { localStorage.setItem(CONFIG.RECENT_KEY, JSON.stringify(recent)); } catch (e) {}
};

const encode = () => {
    const data = items.map(x => [x.n, x.t, Math.round(x.p * 100) / 100, x.c, x.a]);
    return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
};

const decode = str => {
    const data = JSON.parse(decodeURIComponent(escape(atob(str))));
    if (!Array.isArray(data) || !data.length) throw new Error('empty');
    return data.map(([n, t, p, c, a]) => ({
        n: String(n).slice(0, 60),
        t: String(t).slice(0, 40),
        p: Math.max(0.01, Number(p) || 1),
        c: HEX.test(c) ? c.toLowerCase() : '#ffffff',
        a: Math.min(1, Math.max(0.1, Number(a) || 0.8))
    }));
};

const loadState = () => {
    const match = location.hash.match(/^#s=(.+)$/);
    if (match) {
        try { return decode(match[1]).map(makeItem); } catch (e) {}
    }
    return DEFAULTS.map(makeItem);
};

const toast = text => {
    const el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.remove('show'), 2200);
};

const share = async () => {
    const url = `${location.href.split('#')[0]}#s=${encode()}`;
    history.replaceState(null, '', url);
    if (navigator.share) {
        try {
            await navigator.share({ title: 'Моя схема инвестиций', url });
            return;
        } catch (e) {
            if (e.name === 'AbortError') return;
        }
    }
    try {
        await navigator.clipboard.writeText(url);
        toast('Ссылка скопирована');
    } catch (e) {
        prompt('Скопируйте ссылку:', url);
    }
};

/* Один и тот же коэффициент для текста в кусках и для цифр на линейке:
   чем меньше экран, тем крупнее (до 1.9x). */
const textK = () => {
    const w = canvas.getBoundingClientRect().width || 1400;
    return Math.max(1, Math.min(1.9, (11 * 1400) / (24 * w)));
};

const buildScale = () => {
    const total = 100;
    const k = 1 + (textK() - 1) * CONFIG.SCALE_TEXT_BOOST;
    let html = '';
    for (let val = 1; val <= total; val++) {
        const angle = (val / total) * Math.PI * 2 - Math.PI / 2;
        const is20 = val % 20 === 0;
        const is10 = val % 10 === 0 && !is20;
        const is5 = val % 5 === 0 && !is10 && !is20;

        let outer = 100, inner = 98.5, width = .3, opacity = .2;
        if (is20) { outer = 101.2; inner = 96.5; width = .7; opacity = .9; }
        else if (is10) { outer = 100.8; inner = 97.2; width = .5; opacity = .6; }
        else if (is5) { outer = 100.4; inner = 97.8; width = .35; opacity = .4; }

        const cos = Math.cos(angle), sin = Math.sin(angle);
        html += `<line x1="${100 + outer * cos}" y1="${100 + outer * sin}" x2="${100 + inner * cos}" y2="${100 + inner * sin}" stroke="rgba(255,255,255,${opacity})" stroke-width="${width}"/>`;

        if (is20 || is10 || is5 || val === 1) {
            let size = 2.2, fade = .4, weight = 400;
            if (val === 1) { size = 2; fade = .35; }
            else if (is20) { size = 4.2; fade = 1; weight = 700; }
            else if (is10) { size = 3.3; fade = .75; weight = 600; }
            else if (is5) { size = 2.6; fade = .55; weight = 500; }
            size *= k;
            const rad = 102.4 + size * .5;
            html += `<text x="${100 + rad * cos}" y="${100 + rad * sin}" fill="rgba(255,255,255,${fade})" font-size="${size.toFixed(2)}" font-weight="${weight}" text-anchor="middle" dominant-baseline="central">${is20 ? 20 : is10 ? 10 : is5 ? 5 : val}</text>`;
        }
    }
    $('ticks').innerHTML = html;

    const g = CONFIG.BACK_LENS_GLOW;
    const blur = g * 75;
    const alpha = Math.min(0.3 + g * 0.6, 0.9);
    $('scale').style.filter = `drop-shadow(0 0 ${blur}px rgba(255,255,255,${alpha})) drop-shadow(0 0 ${blur / 2}px rgba(255,255,255,${alpha}))`;
};

const totalWeight = () => items.reduce((s, x) => s + (x.enabled ? x.p : 0), 0);
const shareOf = (x, sum) => x.enabled && sum ? Math.round((x.p / sum) * 1000) / 10 : 0;

const setShare = (x, value) => {
    if (!x.enabled) return;
    const rest = items.filter(i => i.enabled && i !== x).reduce((s, i) => s + i.p, 0);
    if (!rest) return;
    const v = Math.min(99, Math.max(1, value));
    x.p = (v * rest) / (100 - v);
    const sum = rest + x.p;
    items.forEach(i => {
        if (i.enabled) i.p = Math.max(0.01, Math.round((i.p * 10000) / sum) / 100);
    });
};

const bindEditable = (el, x, key, fallback, max) => {
    el.addEventListener('input', () => {
        x[key] = el.textContent.slice(0, max);
        requestRender();
    });
    el.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
    el.addEventListener('paste', e => {
        e.preventDefault();
        document.execCommand('insertText', false, e.clipboardData.getData('text/plain').replace(/\s+/g, ' '));
    });
    el.addEventListener('blur', () => {
        x[key] = el.textContent.trim() || fallback;
        el.textContent = x[key];
        requestRender();
    });
};

const bindPercent = (el, x) => {
    el.addEventListener('click', () => {
        if (!x.enabled) toggle(x.id);
    });
    el.addEventListener('focus', () => {
        if (!x.enabled) return el.blur();
        el.textContent = String(shareOf(x, totalWeight()));
        selectAll(el);
    });
    el.addEventListener('input', () => {
        const clean = el.textContent.replace(/[^\d.,]/g, '').replace(',', '.');
        if (clean !== el.textContent) {
            el.textContent = clean;
            caretToEnd(el);
        }
    });
    el.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
    el.addEventListener('blur', () => {
        const value = parseFloat(el.textContent);
        if (!isNaN(value)) setShare(x, value);
        paintList();
        requestRender();
    });
};

const buildList = () => {
    listEl.innerHTML = '';
    items.forEach(x => {
        const row = document.createElement('div');
        row.className = 'item';
        row.dataset.id = x.id;
        row.innerHTML = `<span class="dot"></span><span class="label"><span class="name" contenteditable="true" spellcheck="false">${escapeHtml(x.n)}</span><span class="ticker" contenteditable="true" spellcheck="false">${escapeHtml(x.t)}</span><span class="pct" contenteditable="true" inputmode="decimal" spellcheck="false"></span></span><button class="del" title="Удалить">✕</button>`;
        row.addEventListener('mouseenter', () => setHover(x.id));
        row.addEventListener('mouseleave', () => setHover(null));
        row.querySelector('.dot').addEventListener('click', e => togglePopover(x.id, e.currentTarget));
        row.querySelector('.del').addEventListener('click', () => removeItem(x.id));
        bindEditable(row.querySelector('.name'), x, 'n', 'Без названия', 60);
        bindEditable(row.querySelector('.ticker'), x, 't', '', 40);
        bindPercent(row.querySelector('.pct'), x);
        listEl.appendChild(row);
    });

    const add = document.createElement('button');
    add.className = 'add';
    add.title = 'Добавить инвестицию';
    add.textContent = '+';
    add.addEventListener('click', addItem);
    listEl.appendChild(add);

    paintList();
};

const paintList = () => {
    const sum = totalWeight();
    items.forEach(x => {
        const row = listEl.querySelector(`.item[data-id="${x.id}"]`);
        if (!row) return;
        const dot = row.querySelector('.dot');
        const pct = row.querySelector('.pct');
        const hovered = hoveredId === x.id;

        row.classList.toggle('hovered', hovered && x.enabled);
        row.classList.toggle('off', !x.enabled);
        pct.contentEditable = x.enabled;

        if (!x.enabled) {
            dot.style.cssText = `background:${rgba(x.c, x.a)};border:1px solid rgba(255,255,255,.1)`;
            pct.textContent = 'Выкл';
            return;
        }
        const glow = hovered ? CONFIG.DOT_GLOW_ON : CONFIG.DOT_GLOW_OFF;
        dot.style.cssText = `background:${rgba(x.c, x.a)};box-shadow:0 0 20px ${hovered ? 4 : 1}px ${rgba(x.c, glow)};border:1.5px solid ${rgba(x.c, CONFIG.NEON_BORDER_BRIGHTNESS)}`;
        if (document.activeElement !== pct) pct.textContent = `${shareOf(x, sum)}%`;
    });
};

const render = () => {
    const sum = totalWeight();
    const { CENTER, BASE_RADIUS } = CONFIG;
    const k = textK();
    let animating = false;

    ctx.clearRect(0, 0, 1400, 1400);
    slices = [];

    items.forEach(x => {
        const target = hoveredId === x.id && x.enabled ? CONFIG.HOVER_SCALE : 1;
        const diff = target - x.scale;
        if (Math.abs(diff) > .001) { x.scale += diff * .22; animating = true; }
        else x.scale = target;
    });

    let start = -Math.PI / 2;
    items.forEach(x => {
        const pct = shareOf(x, sum);
        if (pct <= 0) return;

        const span = (pct / 100) * Math.PI * 2;
        const end = start + span;
        const mid = start + span / 2;
        const r = BASE_RADIUS * x.scale;
        slices.push({ id: x.id, start, end, r });

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(CENTER, CENTER);
        ctx.arc(CENTER, CENTER, r, start, end);
        ctx.closePath();
        ctx.shadowColor = rgba(x.c, 1);
        ctx.shadowBlur = hoveredId === x.id ? CONFIG.PIZZA_GLOW_ON * 70 : CONFIG.PIZZA_GLOW_OFF * 75;
        ctx.fillStyle = rgba(x.c, x.a);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.lineWidth = 3;
        ctx.strokeStyle = rgba(x.c, CONFIG.NEON_BORDER_BRIGHTNESS);
        ctx.stroke();

        if (pct >= 4) {
            const tr = r * .63;
            const tx = CENTER + tr * Math.cos(mid);
            const ty = CENTER + tr * Math.sin(mid);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `600 ${24 * k}px sans-serif`;
            ctx.fillText(x.n, tx, ty - 16 * k);
            ctx.fillStyle = 'rgba(255,255,255,.85)';
            ctx.font = `500 ${19 * k}px sans-serif`;
            ctx.fillText(`${x.t} • ${pct}%`, tx, ty + 16 * k);
        }
        ctx.restore();

        start = end;
    });

    if (animating) requestRender();
};

const requestRender = () => {
    if (frame) return;
    frame = requestAnimationFrame(() => {
        frame = 0;
        render();
    });
};

const refresh = () => {
    paintList();
    requestRender();
};

const setHover = id => {
    if (hoveredId === id) return;
    hoveredId = id;
    refresh();
};

const toggle = id => {
    const x = items.find(i => i.id === id);
    if (!x) return;
    if (x.enabled && items.filter(i => i.enabled).length === 1) return;
    x.enabled = !x.enabled;
    if (!x.enabled && hoveredId === id) hoveredId = null;
    refresh();
};

const removeItem = id => {
    if (items.length === 1) { toast('Нужна хотя бы одна инвестиция'); return; }
    items = items.filter(i => i.id !== id);
    if (!items.some(i => i.enabled)) items[0].enabled = true;
    if (hoveredId === id) hoveredId = null;
    closePopover();
    buildList();
    requestRender();
};

const addItem = () => {
    const color = PALETTE[items.length % PALETTE.length];
    const x = makeItem({ n: 'Новая инвестиция', t: 'TICKER', p: 10, c: color, a: 0.8 });
    items.push(x);
    buildList();
    requestRender();
    const name = listEl.querySelector(`.item[data-id="${x.id}"] .name`);
    name.focus();
    selectAll(name);
};

const current = () => items.find(i => i.id === editingId);

const syncPopover = x => {
    $('fAlpha').value = x.a;
    $('fAlpha').style.setProperty('--c', x.c);
    $('aVal').textContent = `${Math.round(x.a * 100)}%`;

};

const renderSwatches = x => {
    $('swatches').innerHTML = recent.map(c => `<button class="sw" data-color="${c}" style="background:${c}"></button>`).join('')
        + `<span class="rainbow"><input type="color" id="fColor" value="${x.c}"></span>`;
    $('swatches').querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => {
        setColor(b.dataset.color);

    }));

    picker.addEventListener('input', e => setColor(e.target.value));
    picker.addEventListener('change', e => {
        pushRecent(e.target.value);
        renderSwatches(x);
        syncPopover(x);
    });
    syncPopover(x);
};

const setColor = color => {
    const x = current();
    if (!x) return;
    x.c = color.toLowerCase();
    syncPopover(x);
    refresh();
};

const togglePopover = (id, anchor) => {
    if (pop.classList.contains('open') && editingId === id) return closePopover();
    const x = items.find(i => i.id === id);
    if (!x) return;
    editingId = id;

    if (top + pop.offsetHeight > innerHeight - 12) top = Math.max(12, rc.top - pop.offsetHeight - 12);
    pop.style.left = `${left}px`;
    pop.style.top = `${top}px`;
};

const closePopover = () => {

    editingId = null;
};

$('fAlpha').addEventListener('input', e => {
    const x = current();
    if (!x) return;
    x.a = Number(e.target.value);
    $('aVal').textContent = `${Math.round(x.a * 100)}%`;

});

document.addEventListener('pointerdown', e => {
    if (!pop.contains(e.target) && !e.target.classList.contains('dot')) closePopover();
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closePopover(); closeAi(); }
});
$('share').addEventListener('click', share);

const hitTest = e => {
    const rc = canvas.getBoundingClientRect();
    const x = (e.clientX - rc.left) * (1400 / rc.width) - CONFIG.CENTER;
    const y = (e.clientY - rc.top) * (1400 / rc.height) - CONFIG.CENTER;
    let angle = Math.atan2(y, x);
    if (angle < -Math.PI / 2) angle += Math.PI * 2;
    const dist = Math.hypot(x, y);
    const hit = slices.find(s => angle >= s.start && angle <= s.end && dist <= s.r);
    return hit ? hit.id : null;
};

canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') setHover(hitTest(e));
});
canvas.addEventListener('pointerleave', () => setHover(null));
canvas.addEventListener('click', e => {
    const id = hitTest(e);
    if (id !== null) toggle(id);
});

/* ---------- AI: средняя доходность фондов ---------- */
const aiPanel = $('aiPanel');
const aiBody = $('aiBody');
const aiBtn = $('aiBtn');
let aiCache = { key: '', html: '' };

const aiFunds = () => {
    const sum = totalWeight();
    return items.filter(x => x.enabled).map(x => ({
        id: x.id, name: x.n, ticker: x.t, weight: shareOf(x, sum), color: x.c
    }));
};

const closeAi = () => aiPanel.classList.remove('open');
const openAi = () => aiPanel.classList.add('open');


const buildPrompt = funds => `Ты финансовый аналитик. Для каждой позиции оцени среднегодовую доходность (CAGR, номинальная, % годовых, в USD) за последние ${CONFIG.AI_YEARS.join(', ')} лет.
Правила:
1. Токенизированный актив (токен акции, ETF, облигации, золота, недвижимости и т.п.) равен базовому активу 1 к 1. Поэтому доходность и срок истории бери по базовой акции, ETF или активу и по дате его запуска, а не по дате запуска токена или эмитента.
2. Рядом с тикером могут быть названия эмитентов токена (например «bXLP Backed, Ondo, Dinari»). Это не часть тикера. Разные эмитенты одного актива дают одну и ту же историю доходности.
3. Если базового актива не существовало за весь срок (он появился позже), ставь null для этого срока. Не подставляй индексы или аналоги.
4. since: год, с которого существует базовый актив (число) или null.
5. Округляй до 0.1. Если оценить честно нельзя, ставь null.
6. Сейчас ${new Date().getFullYear()} год. Срок в N лет возможен, только если актив существовал N лет назад. Иначе ставь null. Никогда не растягивай историю дальше года запуска.
7. Если не уверен в цифре, ставь null. Лучше null, чем выдумка. Не придумывай историю для платформ и неликвидных активов: RealT (токенизированная недвижимость) существует с 2019 года, USDY с 2023 года.
8. Известные годы запуска базовых активов: XLP, XLV, XLU (сектора S&P 500) с 1998, ETF на TIPS (TIP) с 2003.

Позиции:
${funds.map((f, i) => `${i + 1}. ${f.name} (${f.ticker}), доля ${f.weight}%`).join('\n')}

Кроме таблицы, оцени портфель целиком с учётом долей: summary (1-2 предложения о том, что это за портфель), pros (2-3 плюса), cons (2-3 минуса и риска), ideas (2-3 идеи, что стоит попробовать или изменить). Если у токена указано несколько эмитентов, отметь, что это снижает риск одного эмитента. Если у токена эмитент один или не указан, отметь концентрацию риска эмитента. Каждый пункт до 18 слов, по-русски, конкретно, без гарантий доходности.

Ответь ТОЛЬКО валидным JSON без пояснений и без markdown, строго в формате:
{"funds":[{"since":год_или_null,"returns":{${CONFIG.AI_YEARS.map(y => `"${y}":число_или_null`).join(',')}}}],"summary":"текст","pros":["..."],"cons":["..."],"ideas":["..."]}
Порядок позиций в массиве должен совпадать с порядком в списке. Всего позиций: ${funds.length}.`;

const listOf = v => Array.isArray(v) ? v.map(x => String(x).slice(0, 220)).filter(Boolean).slice(0, 4) : [];

const parseAi = (text, count) => {
    const clean = text.replace(/```json|```/g, '');
    const s = clean.indexOf('{'), e = clean.lastIndexOf('}');
    if (s < 0 || e < 0) throw new Error('bad json');
    const data = JSON.parse(clean.slice(s, e + 1));
    if (!Array.isArray(data.funds) || data.funds.length < count) throw new Error('bad shape');
    return {
        funds: data.funds.slice(0, count).map(f => ({
            since: Number(f.since) >= 1800 && Number(f.since) <= 2100 ? Math.round(Number(f.since)) : null,
            returns: Object.fromEntries(CONFIG.AI_YEARS.map(y => {
                const v = Number(f.returns && f.returns[y]);
                return [y, f.returns && f.returns[y] != null && isFinite(v) ? v : null];
            }))
        })),
        summary: String(data.summary || '').slice(0, 400),
        pros: listOf(data.pros),
        cons: listOf(data.cons),
        ideas: listOf(data.ideas)
    };
};

const fmtNum = v => (v > 0 ? '+' : '') + v.toFixed(1).replace('.', ',');
const cell = v => v == null
    ? '<td class="na">✕</td>'
    : `<td class="${v >= 0 ? 'up' : 'down'}">${fmtNum(v)}</td>`;
const totalCell = t => t == null
    ? '<td class="na">✕</td>'
    : `<td class="${t.v >= 0 ? 'up' : 'down'}"${t.partial ? ` title="Учтено ${Math.round(t.cover * 10) / 10}% портфеля, остальное распределено пропорционально"` : ''}>${fmtNum(t.v)}${t.partial ? '<sup>*</sup>' : ''}</td>`;

const subLine = (f, r) => r.since ? `<span class="ai-sub">с ${r.since}</span>` : '';

const renderAi = (funds, parsed) => {
    const res = parsed.funds;
    const years = CONFIG.AI_YEARS;
    const head = `<tr><th>Фонд</th>${years.map(y => `<th>${y}л</th>`).join('')}</tr>`;
    const rows = funds.map((f, i) => {
        const r = res[i];
        return `<tr><td><span class="ai-fund"><i style="background:${f.color}"></i><span>${escapeHtml(f.ticker || f.name)}${subLine(f, r)}</span></span></td>${years.map(y => cell(r.returns[y])).join('')}</tr>`;
    }).join('');

    /* Если у позиции нет данных за срок, её доля делится между остальными
       пропорционально их долям: считаем средневзвешенное по тем, что есть. */
    let anyPartial = false;
    const total = years.map(y => {
        let acc = 0, w = 0, missing = false;
        for (let i = 0; i < funds.length; i++) {
            const v = res[i].returns[y];
            if (v == null) { missing = true; continue; }
            acc += v * funds[i].weight;
            w += funds[i].weight;
        }
        if (!w) return null;
        if (missing) anyPartial = true;
        return { v: acc / w, partial: missing, cover: w };
    });
    const totalRow = `<tr class="total"><td>Портфель</td>${total.map(totalCell).join('')}</tr>`;

    const block = (title, cls, arr) => arr.length
        ? `<h4>${title}</h4><ul class="${cls}">${arr.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>`
        : '';

    return `<div class="ai-scroll"><table class="ai-table">${head}${rows}${totalRow}</table></div>
        <div class="ai-review">${parsed.summary ? `<p>${escapeHtml(parsed.summary)}</p>` : ''}${block('Плюсы', 'pros', parsed.pros)}${block('Минусы', 'cons', parsed.cons)}${block('Что попробовать или изменить', 'ideas', parsed.ideas)}</div>${anyPartial ? '<div class="ai-src">* Для сроков, где у позиции нет данных (✕), её доля распределена между остальными позициями пропорционально их долям.</div>' : ''}`;
};

/* Годы запуска известных базовых активов: по ним обрезаем выдуманную историю в ответе ИИ. */
const KNOWN_ASSETS = [
    { since: 2003, re: /tips|инфляц/i },
    { since: 1998, re: /xlp|продукт|товар/i },
    { since: 1998, re: /xlv|медицин|аптек|health/i },
    { since: 1998, re: /xlu|энергет|жкх|utilit/i },
    { since: 2019, re: /realt|недвижим|real\s*estate/i },
    { since: 2023, re: /usdy|usdt|usdc|кэш|cash|налич/i }
];

const aiReason = err => {
    const m = String(err && err.message || err || '');
    if (!CONFIG.AI_PROXY_URL) return 'не указан адрес сервера ИИ';
    const detail = ` (${err && err.name ? err.name + ': ' : ''}${m})`;
    if (err && err.name === 'AbortError') return 'истекло время ожидания';
    if (/http 429/.test(m)) return 'исчерпан дневной лимит, попробуйте позже';
    if (/http 5\d\d|http 403/.test(m)) return 'сервер ИИ недоступен или отклонил запрос';
    if (/bad json|bad shape|JSON/.test(m)) return 'ИИ вернул ответ в непонятном формате, попробуйте ещё раз';
    if (/fetch|Load failed|NetworkError/i.test(m)) return 'нет связи с сервером ИИ' + detail;
    return (m || 'неизвестная ошибка');
};

const askAi = async prompt => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONFIG.AI_TIMEOUT);
    try {
        const response = await fetch(CONFIG.AI_PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt }),
            signal: ctrl.signal
        });
        if (!response.ok) throw new Error('http ' + response.status);
        const data = await response.json();
        return String(data.text || '');
    } finally {
        clearTimeout(timer);
    }
};

/* Проверка ответа ИИ: год запуска берём из своей таблицы, сроки длиннее истории и
   нереальные цифры обнуляем, чтобы выдумки модели не попадали в таблицу. */
const sanitizeAi = (funds, parsed) => {
    const now = new Date().getFullYear();
    parsed.funds = parsed.funds.map((r, i) => {
        const f = funds[i];
        const hit = f && KNOWN_ASSETS.find(d => d.re.test(`${f.ticker} ${f.name}`));
        const since = hit ? hit.since : r.since;
        const returns = {};
        CONFIG.AI_YEARS.forEach(y => {
            const v = r.returns[y];
            const tooLong = since && now - since < y;
            returns[y] = v == null || tooLong || v < -30 || v > 60 ? null : v;
        });
        return { since, returns };
    });
    return parsed;
};

const compute = async () => {
    const funds = aiFunds();
    const cacheKey = JSON.stringify(funds.map(f => [f.name, f.ticker, f.weight]));
    if (aiCache.key === cacheKey && aiCache.html) { aiBody.innerHTML = aiCache.html; return; }

    if (!CONFIG.AI_PROXY_URL) {
        aiBody.innerHTML = `<div class="ai-msg err">ИИ не ответил: ${escapeHtml(aiReason(null))}.</div>`;
        return;
    }

    aiBody.innerHTML = '<div class="ai-msg">ИИ считает среднюю доходность…</div>';
    aiBtn.classList.add('busy');
    let parsed = null, lastErr = null;
    try {
        parsed = sanitizeAi(funds, parseAi(await askAi(buildPrompt(funds)), funds.length));
    } catch (err) {
        lastErr = err;
        console.warn('AI failed:', err);
    }
    aiBtn.classList.remove('busy');

    if (!parsed) {
        aiBody.innerHTML = `<div class="ai-msg err">ИИ не ответил: ${escapeHtml(aiReason(lastErr))}. Нажмите «Ai» ещё раз.</div>`;
        return;
    }

    const html = renderAi(funds, parsed);
    aiCache = { key: cacheKey, html };
    aiBody.innerHTML = html;
};

const runAi = () => {
    if (aiPanel.classList.contains('open')) { closeAi(); return; }
    openAi();
    compute();
};

aiBtn.addEventListener('click', runAi);
$('aiClose').addEventListener('click', closeAi);

/* Запрет приближения: щипок и двойной тап (iOS игнорирует user-scalable) */
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd < 350 && !e.target.closest('[contenteditable="true"],input')) e.preventDefault();
    lastTouchEnd = now;
}, { passive: false });

let resizeTimer = 0;
addEventListener('resize', () => {
    requestRender();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildScale, 80);
});

items = loadState();
buildScale();
buildList();
render();
</script>
</body>
</html>
